name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test Aurora layout acceptance before building
        run: python3 tools/test_aurora_strip.py

      - name: Verify real two-slot suggestion implementation is committed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('app/src/main/java/helium314/keyboard/latin/suggestions/SuggestionStripLayoutHelper.java').read_text()
          assert 'mSuggestionsCountInStrip = 2;' in source, 'Two suggestions are not committed to source'
          assert 'mCenterSuggestionWeight = 0.50f;' in source, 'Suggestion slots are not equal width'
          assert 'positionInStrip >= maxSuggestionInStrip' in source, 'Suggestion indexes lack bounds checking'
          print('Committed two-slot source assertions passed')
          PY

      - name: Run Android unit tests (fail build on regression)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuroraNext-debug
          path: app/build/outputs/apk/debug/*-debug*.apk
          if-no-files-found: error

      - name: Archive unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-unit-test-results
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
