name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test Aurora layout acceptance before building
        run: python3 tools/test_aurora_strip.py

      - name: Apply and verify Aurora Next two-slot suggestion engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/helium314/keyboard/latin/suggestions/SuggestionStripLayoutHelper.java')
          source = p.read_text()
          replacements = [
              (
                  '        mSuggestionsCountInStrip = a.getInt(\n                R.styleable.SuggestionStripView_suggestionsCountInStrip,\n                DEFAULT_SUGGESTIONS_COUNT_IN_STRIP);',
                  '        mSuggestionsCountInStrip = 2; // Aurora Next: exactly two suggestions.',
              ),
              (
                  '        mCenterSuggestionWeight = ResourceUtils.getFraction(a,\n                R.styleable.SuggestionStripView_centerSuggestionPercentile,\n                DEFAULT_CENTER_SUGGESTION_PERCENTILE);',
                  '        mCenterSuggestionWeight = 0.50f; // Both suggestions are equally wide.',
              ),
              (
                  '            if (positionInStrip < 0) {\n                continue;\n            }\n            final TextView wordView = mWordViews.get(positionInStrip);',
                  '            if (positionInStrip < 0 || positionInStrip >= maxSuggestionInStrip) {\n                continue;\n            }\n            final TextView wordView = mWordViews.get(positionInStrip);',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'Expected exactly one matching Aurora patch site, found {source.count(old)}: {old[:70]!r}')
              source = source.replace(old, new, 1)
          p.write_text(source)
          assert 'mSuggestionsCountInStrip = 2;' in p.read_text()
          assert 'positionInStrip >= maxSuggestionInStrip' in p.read_text()
          print('Aurora Next suggestion engine: two equal slots, bounded indexes, patch verified')
          PY

      - name: Run Android unit tests (fail build on regression)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuroraNext-debug
          path: app/build/outputs/apk/debug/*-debug*.apk
          if-no-files-found: error

      - name: Archive unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-unit-test-results
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
