name: Aurora Hangul cursor repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurora-hangul-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Confirm regression fails before repair
        run: |
          chmod +x gradlew
          if ./gradlew :app:testDebugUnitTest --tests 'helium314.keyboard.latin.InputLogicTest.insertLetterIntoWordHangulFails' --stacktrace; then
            echo 'Baseline test already passes; refusing to apply an unnecessary patch.'
            exit 1
          fi
      - name: Repair Hangul cursor edit in tracked Android source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/helium314/keyboard/latin/inputlogic/InputLogic.java')
          old = '        Event processedEvent = mWordComposer.processEvent(event);'
          replacement = '''        // Hangul consumes character events inside its combiner. If the cursor was moved
        // into an existing composing word, reprocessing the whole word here would replace
        // text at the insertion point and duplicate the original prefix. Finish the old
        // composition before letting the combiner handle the newly inserted character.
        // Scope this to Hangul character input; keep backspace, shift and other combiners intact.
        if ("hangul".equals(mWordComposer.getCombiningSpec())
                && mWordComposer.isComposingWord()
                && mWordComposer.isCursorFrontOrMiddleOfComposingWord()
                && event.getCodePoint() > 0 && !event.isFunctionalKeyEvent()) {
            resetEntireInputState(mConnection.getExpectedSelectionStart(),
                    mConnection.getExpectedSelectionEnd(), true /* clearSuggestionStrip */);
        }
        Event processedEvent = mWordComposer.processEvent(event);'''
          source = path.read_text()
          assert source.count(old) == 1, 'InputLogic insertion anchor not unique; refusing unsafe repair'
          assert 'Hangul consumes character events inside its combiner' not in source, 'Repair already present'
          path.write_text(source.replace(old, replacement, 1))
          print('Patched InputLogic.java source; regression test must validate behavior before commit.')
          PY
      - name: Verify exact previously failing test
        run: ./gradlew :app:testDebugUnitTest --tests 'helium314.keyboard.latin.InputLogicTest.insertLetterIntoWordHangulFails' --stacktrace
      - name: Verify all Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build debug APK after all tests pass
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Commit tested source repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/helium314/keyboard/latin/inputlogic/InputLogic.java
          git diff --cached --check
          git commit -m 'Fix Hangul insertion after moving cursor within composition'
          git push origin HEAD:main
      - name: Archive complete unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-hangul-repair-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Archive unreleased debug APK for further emulator testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-hangul-repair-unreleased-apk
          path: app/build/outputs/apk/debug/*-debug*.apk
          if-no-files-found: error
