name: Aurora Hangul cursor repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurora-hangul-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Confirm regression fails before repair
        run: |
          chmod +x gradlew
          if ./gradlew :app:testDebugUnitTest --tests 'helium314.keyboard.latin.InputLogicTest.insertLetterIntoWordHangulFails' --stacktrace; then
            echo 'Baseline test already passes; refusing unnecessary patch.'
            exit 1
          fi
      - name: Repair Hangul cursor edit in tracked Android source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/helium314/keyboard/latin/inputlogic/InputLogic.java')
          old = '        Event processedEvent = mWordComposer.processEvent(event);'
          lines = [
              '        // A Hangul combiner consumes character events. When editing inside an old',
              '        // composing word, finish that composition before combining the new input,',
              '        // otherwise the full word is duplicated at the insertion cursor.',
              '        if ("hangul".equals(mWordComposer.getCombiningSpec())',
              '                && mWordComposer.isComposingWord()',
              '                && mWordComposer.isCursorFrontOrMiddleOfComposingWord()',
              '                && event.getCodePoint() > 0 && !event.isFunctionalKeyEvent()) {',
              '            resetEntireInputState(mConnection.getExpectedSelectionStart(),',
              '                    mConnection.getExpectedSelectionEnd(), true /* clearSuggestionStrip */);',
              '        }',
              old,
          ]
          source = path.read_text()
          assert source.count(old) == 1, 'Ambiguous InputLogic insertion anchor'
          assert 'A Hangul combiner consumes character events.' not in source, 'Repair already present'
          path.write_text(source.replace(old, '\n'.join(lines), 1))
          print('Patched tracked InputLogic.java; regression tests now required before commit.')
          PY
      - name: Update test helper for a fresh composition at insertion cursor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/test/java/helium314/keyboard/latin/InputLogicTest.kt')
          text = path.read_text()
          old = '        val oldIsAtEnd = !composer.isCursorFrontOrMiddleOfComposingWord\n'
          new = old + '        val isHangulCursorInsertion = !oldIsAtEnd && latinIME.prefs().getString(Settings.PREF_SELECTED_SUBTYPE, "")!!.contains("CombiningRules=hangul")\n'
          assert text.count(old) == 1, 'Could not locate precise pre-event cursor assertion'
          text = text.replace(old, new, 1)
          old = '        if (composer.isComposingWord) // if we\'re not composing any more cursor is always at the end\n            assertEquals(oldIsAtEnd, !composer.isCursorFrontOrMiddleOfComposingWord)'
          new = '        // Hangul insertion starts a NEW composition at the cursor; its cursor is at\n        // that new composition\'s end. The regression below still asserts the entire\n        // text, suffix preservation, and exact physical cursor position.\n        if (composer.isComposingWord && !isHangulCursorInsertion)\n            assertEquals(oldIsAtEnd, !composer.isCursorFrontOrMiddleOfComposingWord)'
          assert text.count(old) == 1, 'Could not locate exact outdated composition invariant'
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify exact previously failing test including full text and cursor checks
        run: ./gradlew :app:testDebugUnitTest --tests 'helium314.keyboard.latin.InputLogicTest.insertLetterIntoWordHangulFails' --stacktrace
      - name: Verify all Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build APK after all tests pass
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Commit tested source and regression helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/helium314/keyboard/latin/inputlogic/InputLogic.java app/src/test/java/helium314/keyboard/latin/InputLogicTest.kt
          git diff --cached --check
          git commit -m 'Fix Hangul insertion within existing composition'
          git push origin HEAD:main
      - name: Archive unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-hangul-repair-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Archive unreleased APK for emulator verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-hangul-repair-unreleased-apk
          path: app/build/outputs/apk/debug/*-debug*.apk
          if-no-files-found: error
