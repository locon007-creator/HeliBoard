name: Aurora Android emulator audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurora-emulator-audit.yml'
      - 'app/**'
      - 'tools/test_aurora_strip.py'
      - 'tools/aurora_emulator_audit.sh'

jobs:
  emulator-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Enable hardware acceleration and record environment
        run: |
          mkdir -p audit
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          { uname -a; ls -l /dev/kvm 2>&1 || true; df -h .; } > audit/environment.txt
      - name: Verify acceptance checks, all Android unit tests, and build APK
        run: |
          chmod +x gradlew
          python3 tools/test_aurora_strip.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path('app/src/main/java/helium314/keyboard/latin/suggestions/SuggestionStripLayoutHelper.java').read_text()
          assert 'mSuggestionsCountInStrip = 2;' in source
          assert 'mCenterSuggestionWeight = 0.50f;' in source
          assert 'positionInStrip >= maxSuggestionInStrip' in source
          print('Committed two-slot source verified')
          PY
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Boot emulator and audit Android installation, Settings, and IME service
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          # The action executes every line of script separately under POSIX sh.
          # Invoke one Bash file to preserve variables, pipes, traps and exit status.
          script: bash tools/aurora_emulator_audit.sh
      - name: Upload emulator screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-emulator-audit
          path: audit/
          if-no-files-found: error
      - name: Archive Android unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-emulator-unit-tests
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Archive emulator-audited APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-emulator-audited-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
